        if (typeof window !== 'undefined') {
            window.process = window.process || { env: { API_KEY: "", NODE_ENV: "production" } };

                if (typeof window.fetch === 'function') {
                    const originalFetch = window.fetch.bind(window);
                    let _activeFetch = originalFetch;
                    Object.defineProperty(window, 'fetch', {
                        get() { return _activeFetch; },
                        set(fn) { if (typeof fn === 'function') _activeFetch = fn; },
                        configurable: true,
                        enumerable: true
                    });
                }

            }
        }
